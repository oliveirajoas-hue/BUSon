<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a8f4e">
  <title>BUSon</title>
  
  <!-- Fontes e Estilos de Mapas Externos -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  
  <style>
    :root {
      --ink: #0f1a17;
      --mute: #66736f;
      --bg: #fff;
      --soft: #f1f4f3;
      --line: #e3e9e7;
      --green: #0a8f4e;
      --blue: #2f6bff;
      --red: #e5484d;
      --ok: #12a150;
    }
    
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background: #cfd6d3;
    }
    
    .app {
      position: relative;
      height: 100%;
      max-width: 520px;
      margin: 0 auto;
      overflow: hidden;
      background: #e9eeec;
    }
    
    #map { position: absolute; inset: 0; }

    /* Cartão do Topo (Busca / Origem e Destino) */
    .topcard {
      position: absolute;
      z-index: 5;
      left: 12px;
      right: 12px;
      top: 12px;
      background: var(--bg);
      border-radius: 18px;
      padding: 8px 14px;
      box-shadow: 0 6px 24px rgba(0,0,0,.18);
      display: flex;
      gap: 12px;
    }

    /* Painel Inferior Deslizante */
    .sheet {
      position: absolute;
      z-index: 5;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg);
      border-radius: 26px 26px 0 0;
      padding: 10px 16px;
      box-shadow: 0 -8px 30px rgba(0,0,0,.18);
      max-height: 60%;
      overflow: auto;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Contêiner do Mapa Interativo -->
    <div id="map"></div>  

    <!-- Cartão Superior de Navegação -->
    <div class="topcard">
      <div class="rail"><i></i><b></b><i class="b"></i></div>
      <div class="fields">
        <div class="f">
          <label for="from">Embarque</label>
          <input id="from" list="dlMe" value="Minha localização" autocomplete="off">
        </div>
        <div class="f">
          <label for="to">Destino</label>
          <input id="to" list="dlCity" placeholder="Para qual cidade?" autocomplete="off">
        </div>
      </div>
    </div>

    <!-- Painel Inferior (Listas, Login, Motorista, Admin) -->
    <div class="sheet" id="sheet">
      <div class="grab"></div>
      <section id="pax">
        <div class="empty" id="cfg" hidden>
          <b>Servidor não configurado</b>
          <div class="mute">Preencha o Firebase no código para ver os ônibus em tempo real.</div>
        </div>
      </section>
    </div>
  </div>
</body>
</html>
